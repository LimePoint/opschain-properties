name: OpsChain Context
description: Setup OpsChain Properties Context within a GitHub Action Workflow
author: 'LimePoint Pty Ltd'
branding:
  icon: 'share-2'
  color: 'green'
inputs:
  project:
    type: string
    description: 'Project Code'
    required: true
  environment:
    type: string
    description: 'Environment Code (when provided, scopes the converged_properties request to /environments/{environment})'
    required: false
  asset:
    type: string
    description: 'Asset Code'
    required: true
  change_id:
    type: string
    description: 'OpsChain Change ID Reference'
    required: false
  commit_sha:
    type: string
    description: 'OpsChain Git Commit SHA'
    required: false
  auth_scheme:
    type: string
    description: >-
      OpsChain API auth scheme: basicAuth (default), bearerAuth or cookieAuth.
      bearerAuth/cookieAuth acquire tokens via the v1 /api/tokens routes,
      which are REMOVED from OpsChain v5.2.0-internal onward — basicAuth works
      on both old and new servers until the OIDC-federated suite
      (integrations:github) replaces password auth entirely. An explicit
      OPSCHAIN_API_AUTH_SCHEME environment variable always wins over this input.
    required: false
    default: 'basicAuth'
outputs:
  context:
    description: 'JSON-stringified change object (empty string when change_id is not provided)'
  config:
    description: 'JSON-stringified converged config (with the opschain key removed)'
  env:
    description: 'JSON-stringified env map (with GITHUB_* keys removed)'
runs:
  using: 'node24'
  main: 'dist/index.js'
